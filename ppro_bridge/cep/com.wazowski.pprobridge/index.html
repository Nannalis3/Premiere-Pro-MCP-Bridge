<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MCP Bridge (PPRO)</title>
<style>
  body { background:#232323; color:#ccc; font:12px/1.5 -apple-system, "Segoe UI", sans-serif; margin:0; padding:12px; }
  h1 { font-size:13px; color:#2C8FB4; margin:0 0 8px; }
  #status { color:#8a8a8a; font-size:11px; word-break:break-all; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  button { background:#3a3a3a; color:#ddd; border:1px solid #555; border-radius:3px; padding:4px 10px; cursor:pointer; }
  button:hover { background:#4a4a4a; }
  #log { background:#1a1a1a; border:1px solid #333; border-radius:3px; padding:8px; height:180px;
         overflow:auto; white-space:pre-wrap; font:11px/1.5 Menlo, monospace; color:#9c9; }
</style>
</head>
<body>
  <h1>MCP Bridge — Premiere Pro</h1>
  <div id="status">starting…</div>
  <div class="row">
    <label><input type="checkbox" id="auto" checked> Auto-run commands</label>
    <button id="checkNow">Check now</button>
  </div>
  <div id="log"></div>
  <script src="js/main.js"></script>
</body>
</html>
